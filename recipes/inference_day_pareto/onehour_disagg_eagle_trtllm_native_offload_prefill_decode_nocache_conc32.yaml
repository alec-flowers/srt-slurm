name: onehour_disagg_eagle_trtllm_native_offload_prefill_decode_nocache_conc32
identity:
  model:
    repo: nvidia/Kimi-K2.5-NVFP4
    revision: c0285e649c34d4386b01e38abca642c06cbe014e
  frameworks:
    dynamo: 1.1.0
    tensorrt_llm: 1.3.0rc13
model:
  path: kimi-k25-nvfp4
  container: dyn-110-trtllm-rc13-kvscheduler-fix-condp-branch
  precision: fp4
resources:
  gpu_type: gb200
  prefill_nodes: 3
  prefill_workers: 3
  gpus_per_prefill: 4
  decode_nodes: 3
  decode_workers: 3
  gpus_per_decode: 4
  gpus_per_node: 4
slurm:
  time_limit: "01:45:00"
backend:
  type: trtllm
  prefill_environment:
    TRTLLM_ENABLE_PDL: '1'
    NCCL_GRAPH_MIXING_SUPPORT: '0'
    TRTLLM_TRY_ZCOPY_FOR_KVCACHE_TRANSFER: '1'
    TRTLLM_KVCACHE_TRANSFER_BUFFER_SIZE: 0B
    DYN_TOOL_CALL_PARSER: kimi_k2
    DYN_REASONING_PARSER: kimi_k25
  decode_environment:
    TRTLLM_ENABLE_PDL: '1'
    NCCL_GRAPH_MIXING_SUPPORT: '0'
    ENABLE_CONFIGURABLE_MOE: '1'
    TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: '2'
    TRTLLM_KVCACHE_TRANSFER_BUFFER_SIZE: 0B
    TRTLLM_TRY_ZCOPY_FOR_KVCACHE_TRANSFER: '1'
    OTEL_SERVICE_NAME: dynamo-decode-dep4x3p_tep4x3d-conc32-native-offload-prefill-decode-nocache
    DYN_TOOL_CALL_PARSER: kimi_k2
    DYN_REASONING_PARSER: kimi_k25
  trtllm_config:
    prefill:
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 0
        kv_transfer_sender_future_timeout_ms: 30000
      allreduce_strategy: MNNVL
      max_batch_size: 4
      max_num_tokens: 8192
      enable_chunked_prefill: true
      max_seq_len: 200000
      tensor_parallel_size: 4
      moe_expert_parallel_size: 4
      enable_attention_dp: true
      pipeline_parallel_size: 1
      num_postprocess_workers: 4
      print_iter_log: true
      stream_interval: 100
      trust_remote_code: true
      cuda_graph_config: null
      disable_overlap_scheduler: true
      moe_config:
        backend: TRTLLM
      kv_cache_config:
        enable_block_reuse: true
        free_gpu_memory_fraction: 0.6
        host_cache_size: 107374182400
        secondary_offload_min_priority: 35
        iteration_stats_interval: 1
        dtype: fp8
        tokens_per_block: 32
      speculative_config:
        decoding_type: Eagle
        max_draft_len: 3
        allow_advanced_sampling: true
        speculative_model_dir: /speculative-model
    decode:
      allreduce_strategy: MNNVL
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 0
        kv_transfer_sender_future_timeout_ms: 30000
      max_num_tokens: 640
      cuda_graph_config:
        batch_sizes:
        - 1
        - 2
        - 4
        - 8
        - 16
        - 32
        - 64
        - 128
        enable_padding: true
      enable_attention_dp: false
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: false
        free_gpu_memory_fraction: 0.85
        tokens_per_block: 32
      max_batch_size: 128
      moe_config:
        backend: CUTLASS
        use_low_precision_moe_combine: true
      moe_expert_parallel_size: 4
      nvfp4_gemm_config:
        allowed_backends:
        - cutlass
        - cublaslt
        - cuda_core
      num_postprocess_workers: 8
      print_iter_log: true
      stream_interval: 10
      tensor_parallel_size: 4
      trust_remote_code: true
      speculative_config:
        decoding_type: Eagle
        max_draft_len: 3
        allow_advanced_sampling: true
        speculative_model_dir: /speculative-model
frontend:
  type: dynamo
  args:
    router-mode: kv
    router-reset-states: true
    active-prefill-tokens-threshold: 1000000000
    active-decode-blocks-threshold: 100
    active-prefill-tokens-threshold-frac: 100
  enable_multiple_frontends: false
  env:
    OTEL_SERVICE_NAME: dynamo-frontend-dep4x3p_tep4x3d-conc32-native-offload-prefill-decode-nocache
health_check:
  max_attempts: 500
  interval_seconds: 10
dynamo:
  install: false
infra:
  etcd_nats_dedicated_node: false
  nats_max_payload_mb: 24
observability:
  enable_otel: true
  otel_endpoint: http://10.57.209.4:4317
extra_mount:
- /lustre/fsw/coreai_tritoninference_triton3/aflowers/traces:/traces
- /lustre/fsw/coreai_tritoninference_triton3/aflowers/models/Kimi-K2.5-Thinking-Eagle3:/speculative-model
benchmark:
  type: trace-replay
  trace_file: /traces/kv-reuse-difficult_200k-fixed/dataset.jsonl
  concurrencies: '32'
  ttft_threshold_ms: 5000
  itl_threshold_ms: 10
  aiperf_package: aiperf>=0.7.0
  aiperf_args:
    benchmark-duration: 3600
    benchmark-grace-period: 60
    request-timeout-seconds: 1200
    workers-max: 200
    record-processors: 8
    profile-export-level: raw
    concurrency-ramp-duration: 60
    export-http-trace: true
