name: dep4x1_tep8x2_conc2_condp

model:
  path: kimi-k25-nvfp4
  container: dyn-101-trtllm-rc11-condp
  precision: fp4

resources:
  gpu_type: gb200
  prefill_nodes: 1
  prefill_workers: 1
  gpus_per_prefill: 4
  decode_nodes: 4
  decode_workers: 2
  gpus_per_decode: 8
  gpus_per_node: 4
backend:
  type: trtllm
  conditional_prefill: true
  prefill_environment:
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    TRTLLM_ENABLE_PDL: "1"
    TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: "2"
    OTEL_SERVICE_NAME: "dynamo-prefill-conc4-condp"  # overrides default "dynamo-prefill"
    TRTLLM_TRY_ZCOPY_FOR_KVCACHE_TRANSFER: "1"
    TRTLLM_KVCACHE_TRANSFER_BUFFER_SIZE: "0B"
  decode_environment:
    TLLM_LOG_LEVEL: INFO
    TRTLLM_SERVER_DISABLE_GC: "1"
    TRTLLM_WORKER_DISABLE_GC: "1"
    TRTLLM_ENABLE_PDL: "1"
    NCCL_GRAPH_MIXING_SUPPORT: "0"
    TRTLLM_FORCE_COMM_METHOD: NVLINK_TWO_SIDED
    ENABLE_CONFIGURABLE_MOE: "1"
    TLLM_OVERRIDE_LAYER_NUM: "61"
    TRTLLM_TRY_ZCOPY_FOR_KVCACHE_TRANSFER: "1"
    TRTLLM_KVCACHE_TRANSFER_BUFFER_SIZE: "0B"
    TLLM_SPEC_DECODE_FORCE_NUM_ACCEPTED_TOKENS: "2"
    OTEL_SERVICE_NAME: "dynamo-decode-conc4-condp"  # overrides default "dynamo-decode"
  trtllm_config:
    prefill:
      otlp_traces_endpoint: "http://10.57.209.4:4317"
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 0
        kv_transfer_sender_future_timeout_ms: 30000
      max_batch_size: 4
      max_num_tokens: 8192
      enable_chunked_prefill: true
      max_seq_len: 120000
      tensor_parallel_size: 4
      moe_expert_parallel_size: 4
      enable_attention_dp: false
      pipeline_parallel_size: 1
      num_postprocess_workers: 4
      print_iter_log: true
      stream_interval: 1
      trust_remote_code: true
      cuda_graph_config: null
      disable_overlap_scheduler: true
      moe_config:
        backend: TRTLLM
        use_low_precision_moe_combine: true
      kv_cache_config:
        enable_block_reuse: true
        free_gpu_memory_fraction: 0.55
        dtype: fp8
        tokens_per_block: 32
      speculative_config:
        decoding_type: Eagle
        max_draft_len: 3
        allow_advanced_sampling: true
        speculative_model_dir: /speculative-model
    decode:
      backend: pytorch
      trust_remote_code: true
      allreduce_strategy: MNNVL
      cache_transceiver_config:
        backend: UCX
        max_tokens_in_buffer: 0
        kv_transfer_sender_future_timeout_ms: 30000
      # Keep the per-batch decode token budget low to protect TPOT during
      # conditional local prefill; this matches the routing cap below.
      max_num_tokens: 4096
      enable_chunked_prefill: true
      enable_attention_dp: false
      max_batch_size: 4
      cuda_graph_config:
        batch_sizes:
          - 1
          - 2
          - 4
        enable_padding: true
      kv_cache_config:
        dtype: fp8
        enable_block_reuse: true
        free_gpu_memory_fraction: 0.75
        tokens_per_block: 32
      moe_config:
        backend: TRTLLM
        max_num_tokens: 2048
      moe_expert_parallel_size: 8
      num_postprocess_workers: 8
      print_iter_log: true
      stream_interval: 10
      tensor_parallel_size: 8
      speculative_config:
        decoding_type: Eagle
        max_draft_len: 3
        allow_advanced_sampling: true
        speculative_model_dir: /speculative-model
frontend:
  type: dynamo
  args:
    router-mode: kv
    router-reset-states: true
    conditional-prefill-max-effective-isl: 4096
  enable_multiple_frontends: false
  env:
    OTEL_SERVICE_NAME: "dynamo-frontend-conc4-condp"  # overrides default "dynamo-frontend"
    DYN_LOG: "info,dynamo_kv_router=debug,dynamo_llm::kv_router=debug"

health_check:
  max_attempts: 500
  interval_seconds: 10

dynamo:
  install: false

infra:
  etcd_nats_dedicated_node: true
  nats_max_payload_mb: 24

observability:
  enable_otel: true
  otel_endpoint: "http://10.57.209.4:4317"

extra_mount:
  - "/lustre/fsw/coreai_dlfw_dev/karenc/srt-slurm/traces:/traces"
  - "/lustre/fsw/coreai_dlfw_dev/karenc/models/Kimi-K2.5-Thinking-Eagle3:/speculative-model"

benchmark:
  type: trace-replay
  trace_file: /traces/together-ai-basic-no-delays_119k/dataset.jsonl
  concurrencies: [4] #[1, 2, 4, 6, 8]
  ttft_threshold_ms: 3000
  itl_threshold_ms: 7
  aiperf_package: "aiperf>=0.7.0"
  aiperf_args:
    benchmark-duration: 900
    benchmark-grace-period: 60
    request-timeout-seconds: 1200
    workers-max: 200
    record-processors: 8
    profile-export-level: raw
    concurrency-ramp-duration: 20
    export-http-trace: true
    